# Server Port (default 8085 to avoid Oracle listener on 8080)
server.port=${SERVER_PORT:8085}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careertwin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# File Upload Settings (PDF only, max 10MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/resumes

# Security & JWT (256-bit+ secret key)
app.jwt.secret=${JWT_SECRET:CareerTwinSecretKeyForJwtAuthenticationMustBeVeryLong32CharsOrMoreCareerTwin2026SecureKey!}
app.jwt.expiration-ms=86400000

# Google Gemini API
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models

# Logging
logging.level.com.careertwin=INFO
logging.level.org.springframework.security=WARN
